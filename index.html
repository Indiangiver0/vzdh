<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <title>No Hero Returns</title>
  <style>
    :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0e12; }
    body { color: #ece4d3; font-family: Georgia, serif; overscroll-behavior: none; }
    #game-frame { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    #canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
    #status { position: absolute; inset: 0; display: flex; padding: 24px; overflow-y: auto; background: #0c0e12; text-align: center; }
    .loading-card { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: auto; max-width: 100%; flex-shrink: 0; }
    .crown { font-size: 42px; color: #d6b568; }
    h1 { margin: 0; color: #d6b568; font-size: clamp(26px, 6vw, 42px); font-weight: normal; }
    #status-label { margin: 0; color: #a7b0be; font: 16px/1.5 system-ui, sans-serif; }
    progress { width: min(280px, 80%); height: 8px; accent-color: #d6b568; }
    #status-notice { max-width: 460px; font: 15px/1.5 system-ui, sans-serif; white-space: pre-line; overflow-wrap: anywhere; }
    #retry { min-height: 48px; padding: 12px 24px; border: 1px solid #d6b568; border-radius: 10px; color: #ece4d3; background: #202733; font: 16px system-ui, sans-serif; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <div id="game-frame">
    <canvas id="canvas" tabindex="0" aria-label="No Hero Returns — игровое поле">Для игры нужен браузер с поддержкой Canvas.</canvas>
    <div id="status" role="status" aria-live="polite">
      <div class="loading-card">
      <div class="crown" aria-hidden="true">♜</div>
      <h1>No Hero Returns</h1>
      <p id="status-label">Открываем врата подземелья…</p>
      <progress id="status-progress" aria-label="Загрузка игры"></progress>
      <div id="status-notice" hidden></div>
      <button id="retry" type="button" hidden>Попробовать снова</button>
      </div>
    </div>
  </div>
  <noscript>Включите JavaScript, чтобы открыть игру.</noscript>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":377020,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    (() => {
      const frame = document.getElementById('game-frame');
      const canvas = document.getElementById('canvas');
      // The shell owns sizing (canvasResizePolicy=0). Keep CSS pixels independent
      // from the backing buffer so Godot can use comfortable touch target sizes.
      function fitCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(bounds.width * scale));
        const height = Math.max(1, Math.round(bounds.height * scale));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }
      fitCanvas();
      const sizeObserver = new ResizeObserver(fitCanvas);
      sizeObserver.observe(frame);
      sizeObserver.observe(canvas);
      window.addEventListener('resize', fitCanvas);
      document.addEventListener('fullscreenchange', fitCanvas);

      const overlay = document.getElementById('status');
      const progress = document.getElementById('status-progress');
      const label = document.getElementById('status-label');
      const notice = document.getElementById('status-notice');
      const retry = document.getElementById('retry');
      retry.addEventListener('click', () => window.location.reload());
      function fail(error) {
        console.error(error);
        label.textContent = 'Не удалось открыть подземелье';
        notice.textContent = 'Проверьте соединение и попробуйте снова. Если ошибка повторяется, откройте ссылку в Chrome, Safari или Firefox.\n' + String(error.message || error);
        notice.hidden = false;
        retry.hidden = false;
        progress.hidden = true;
      }
      if (typeof Engine === 'undefined') {
        fail('Файлы игры не загрузились.');
        return;
      }
      const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
      if (missing.length) {
        fail('Браузер не поддерживает: ' + missing.join(', '));
        return;
      }
      const engine = new Engine(GODOT_CONFIG);
      engine.startGame({
        canvas,
        onProgress(current, total) {
          if (total > 0 && current > 0) {
            progress.max = total;
            progress.value = current;
            label.textContent = current < total ? 'Загрузка — ' + Math.floor(current / total * 100) + '%' : 'Поднимаем мост…';
          } else {
            progress.removeAttribute('value');
          }
        }
      }).then(() => overlay.remove(), fail);
    })();
  </script>
</body>
</html>
